services:
  micromouse:
    image: micromouse:humble
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        COURSE_UID: "${LOCAL_UID:-1000}"
        COURSE_GID: "${LOCAL_GID:-1000}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: host
    init: true
    stdin_open: true
    tty: true
    shm_size: "1gb"
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-35}"
      ROS_LOCALHOST_ONLY: "1"
      HOME: /tmp/micromouse-home
    volumes:
      - .:/workspace:ro
      - ./results:/results:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTH_FILE:-/tmp/micromouse.xauth}:/tmp/.Xauthority:ro
